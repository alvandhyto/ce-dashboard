# Deploys to the server on every push to main, through a self-hosted runner installed on the
# server itself (it connects out to GitHub, so the server needn't be reachable from outside).
# The work is in scripts/deploy.sh; this only calls it. "Run workflow" in the Actions tab
# redeploys by hand.

name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# One deploy at a time. A push during a deploy waits for it instead of cancelling it halfway.
concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        # Only the runner registered with the ce-dashboard label picks this up.
        runs-on: [self-hosted, ce-dashboard]
        timeout-minutes: 15
        steps:
            # No checkout: the deploy runs in the app's own folder on the server, not in the
            # runner's work folder. Set the APP_DIR repository variable if it ever moves.
            - name: Deploy
              run: bash "${{ vars.APP_DIR || '/var/www/html/ce-dashboard' }}/scripts/deploy.sh"
