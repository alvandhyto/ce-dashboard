config system global
    set alias "FortiGate-30G"
    set hostname "[HOSTNAME]"
    set pre-login-banner enable
    set switch-controller enable
    set timezone 53
end
config system accprofile
    edit "prof_admin"
        set secfabgrp read-write
        set ftviewgrp read-write
        set authgrp read-write
        set sysgrp read-write
        set netgrp read-write
        set loggrp read-write
        set fwgrp read-write
        set vpngrp read-write
        set utmgrp read-write
        set wifi read-write
    next
end
config system np6xlite
    edit "np6xlite_0"
    next
end
config system interface
    edit "wan"
        set vdom "root"
        set ip [IP_PRIMARY_LINK]
        set alias "[SID_PRIMARY_LINK]"
        set type physical
        set snmp-index 1
    next
    edit "lan1"
        set vdom "root"
        set type physical
        set snmp-index 2
    next
    edit "lan2"
        set vdom "root"
        set type physical
        set snmp-index 3
    next
    edit "a"
        set vdom "root"
        set ip [IP_SECONDARY_LINK]
        set alias "[SID_SECONDARY_LINK]"
        set type physical
        set snmp-index 4
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set snmp-index 5
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 6
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 7
    next
    edit "lan"
        set vdom "root"
        set ip [IP_LAN]
        set allowaccess ping https ssh snmp http telnet
        set type hard-switch
        set role lan
        set snmp-index 8
    next
    edit "Loopback205"
        set vdom "root"
        set ip [IP_LOOPBACK205] 255.255.255.255
        set allowaccess ping https ssh snmp fgfm
        set type loopback
        set role lan
        set snmp-index 9
    next
end
config system physical-switch
    edit "sw0"
        set age-val 0
    next
end
config system virtual-switch
    edit "lan"
        set physical-switch "sw0"
        config port
            edit "lan1"
            next
            edit "lan2"
            next
        end
    next
end
