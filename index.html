<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#F8FAFC" />
        <title>Dashboard Delivery</title>
        <link rel="icon" type="image/png" href="/icons/lintaslogo.png" />
        <!-- Applies the saved theme before the first paint, so dark mode doesn't flash light while the
             bundle loads. Keep in sync with hooks/useTheme.tsx (storage key and colours). -->
        <script>
            (function () {
                var dark;
                try {
                    var saved = localStorage.getItem("theme");
                    if (saved) dark = saved === "dark";
                } catch (e) {}
                if (dark === undefined) dark = matchMedia("(prefers-color-scheme: dark)").matches;
                if (dark) {
                    document.documentElement.classList.add("dark");
                    document.querySelector('meta[name="theme-color"]').content = "#0F1218";
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
