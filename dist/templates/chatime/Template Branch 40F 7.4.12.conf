config system interface
    edit "wan"
        set vdom "root"
        set ip 192.168.254.2 255.255.255.0
        set allowaccess ping snmp
        set type physical
        set tcp-mss 1316
        set alias "[SID_AIRFIBER]-AIRFIBER"
        set monitor-bandwidth enable
        set role wan
        set snmp-index 1
        set mtu-override enable
        set mtu 1400
    next
    edit "lan1"
        set vdom "root"
        set mode dhcp
        set distance 10
        set allowaccess ping snmp
        set type physical
        set alias "[SID_M2M]-M2M-LA"
        set lldp-reception enable
        set role wan
        set snmp-index 2
    next
    edit "lan2"
        set vdom "root"
        set type physical
        set snmp-index 3
    next
    edit "lan3"
        set vdom "root"
        set type physical
        set role lan
        set snmp-index 4
    next
    edit "a"
        set vdom "root"
        set ip 192.168.5.2 255.255.255.0
        set allowaccess ping snmp
        set type physical
        set tcp-mss 1316
        set alias "M2M-NEXTONE"
        set lldp-reception enable
        set monitor-bandwidth enable
        set role wan
        set snmp-index 5
        set mtu-override enable
        set mtu 1400
    next
    edit "modem"
        set vdom "root"
        set mode pppoe
        set status down
        set type physical
        set snmp-index 6
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set snmp-index 14
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 15
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 7
    next
    edit "lan"
        set vdom "root"
        set ip [IP_PTP] 255.255.255.252
        set allowaccess ping https ssh snmp fgfm fabric
        set type hard-switch
        set alias "LAN CHATIME"
        set stp enable
        set monitor-bandwidth enable
        set role lan
        set snmp-index 8
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 169.254.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception enable
        set lldp-transmission enable
        set snmp-index 9
    next
    edit "TNL-DC"
        set vdom "root"
        set ip [IP_TUN_M2M] 255.255.255.255
        set allowaccess ping snmp
        set type tunnel
        set remote-ip 192.168.218.254 255.255.255.0
        set monitor-bandwidth enable
        set snmp-index 23
        set interface "a"
    next
    edit "TUN-HO"
        set vdom "root"
        set ip [IP_TUN_AIRFIBER] 255.255.255.255
        set allowaccess ping snmp
        set type tunnel
        set remote-ip 192.168.217.254 255.255.255.0
        set monitor-bandwidth enable
        set snmp-index 12
        set interface "wan"
    next
    edit "Loopback205"
        set vdom "root"
        set ip [IP_LOOPBACK205] 255.255.255.255
        set allowaccess ping https ssh snmp fgfm
        set type loopback
        set role lan
        set snmp-index 10
    next
    edit "SPOKE-MGMT-OV-1"
        set vdom "root"
        set allowaccess ping ssh
        set type tunnel
        set snmp-index 11
        set interface "wan"
    next
    edit "SPOKE-MGMT-OV-2"
        set vdom "root"
        set allowaccess ping ssh
        set type tunnel
        set snmp-index 13
        set interface "a"
    next
    edit "DC-OV-1"
        set vdom "root"
        set type tunnel
        set snmp-index 16
        set interface "wan"
    next
end
